    <style>html,body{touch-action:none;background:radial-gradient(circle at 50% 30%,#1d2a44,#0b1020);height:100%;margin:0;overflow:hidden}#game{width:100%;height:100%}</style>
    <script type="module" crossorigin src="./assets/index-BkO-Aanf.js"></script>
  </head>
  <body>
    <main id="game"></main>
    <script>
      (function () {
        function show(msg) {
          var d = document.getElementById('boot-error');
          if (!d) {
            d = document.createElement('pre');
            d.id = 'boot-error';
            d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;margin:0;padding:10px 12px;background:#fff3f0;color:#7a2318;font:13px/1.4 monospace;white-space:pre-wrap;border-radius:10px;z-index:9999';
            document.body.appendChild(d);
          }
          d.textContent += 'Something went wrong: ' + msg + '\n';
        }
        addEventListener('error', function (e) { show((e.message || 'load error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
        addEventListener('unhandledrejection', function (e) { show(String(e.reason && (e.reason.stack || e.reason))); });
      })();
    </script>
  </body>
</html>
